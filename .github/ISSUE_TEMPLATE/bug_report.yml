name: 🐛 Bug report
description: Report a confirmed, reproducible problem with SourceVault
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If you're not sure it's a bug yet, please start in the
        [Discord troubleshooting forum](https://discord.gg/tq88MVQjSn) — it's faster for diagnosis.
        **Never include license keys, tokens, or secrets in this form.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected vs. what actually happened.
      placeholder: "Expected the reindex to complete; it exits with ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - WSL2 (Windows)
        - Ubuntu / Debian Linux
        - Docker Compose (shared server / VPS)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SourceVault version
      placeholder: "e.g. 1.3.1"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: npm run doctor output
      description: Paste the output with any tokens or secrets REDACTED.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any error output or log lines, secrets redacted.
      render: shell

